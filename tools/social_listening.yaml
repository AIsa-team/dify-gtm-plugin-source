identity:
  name: "social_listening"
  author: "aisa-team"
  label:
    en_US: "Social Listening"
    zh_Hans: "社交聆听"
    pt_BR: "Escuta Social"
    ja_JP: "ソーシャルリスニング"
description:
  human:
    en_US: "Search posts, profiles and conversations across X, Reddit, Instagram, Pinterest and YouTube — read-only, via AIsa."
    zh_Hans: "跨 X、Reddit、Instagram、Pinterest、YouTube 搜索帖子、个人主页与讨论——只读，由 AIsa 提供。"
    pt_BR: "Pesquise posts, perfis e conversas no X, Reddit, Instagram, Pinterest e YouTube — somente leitura, via AIsa."
    ja_JP: "X、Reddit、Instagram、Pinterest、YouTube全体で投稿・プロフィール・会話を検索——読み取り専用、AIsa経由。"
  llm: "Read-only social listening. Platforms: 'x' (Twitter), 'reddit', 'instagram', 'pinterest', 'youtube'. Modes: 'search' finds recent posts/content matching a query (brand mentions, competitor buzz, audience conversations); 'profile' fetches a public profile (x and instagram only, needs 'handle'). For Reddit, an optional 'subreddit' narrows the search to one community. Use for launch reaction tracking, brand monitoring, and audience research."
parameters:
  - name: platform
    type: select
    required: true
    default: x
    options:
      - value: x
        label:
          en_US: "X (Twitter)"
      - value: reddit
        label:
          en_US: "Reddit"
      - value: instagram
        label:
          en_US: "Instagram"
      - value: pinterest
        label:
          en_US: "Pinterest"
      - value: youtube
        label:
          en_US: "YouTube"
    label:
      en_US: "Platform"
      zh_Hans: "平台"
    human_description:
      en_US: "Which social platform to search."
      zh_Hans: "要搜索的社交平台。"
    llm_description: "One of: x, reddit, instagram, pinterest, youtube."
    form: llm
  - name: mode
    type: select
    required: false
    default: search
    options:
      - value: search
        label:
          en_US: "Search content"
      - value: profile
        label:
          en_US: "Look up a profile"
    label:
      en_US: "Mode"
      zh_Hans: "模式"
    human_description:
      en_US: "'search' for content, 'profile' for a public profile (x/instagram only)."
      zh_Hans: "'search' 搜索内容，'profile' 查询公开主页（仅 x/instagram）。"
    llm_description: "'search' (default) or 'profile'. Profile mode works only for x and instagram and requires 'handle'."
    form: llm
  - name: query
    type: string
    required: false
    label:
      en_US: "Search query"
      zh_Hans: "搜索查询"
    human_description:
      en_US: "What to search for (required in search mode)."
      zh_Hans: "搜索内容（search 模式必填）。"
    llm_description: "The search query — brand name, product, hashtag, or topic. Required when mode is 'search'."
    form: llm
  - name: handle
    type: string
    required: false
    label:
      en_US: "Handle"
      zh_Hans: "用户名"
    human_description:
      en_US: "Username for profile mode, without @ (x/instagram)."
      zh_Hans: "profile 模式的用户名，不含 @（x/instagram）。"
    llm_description: "The account username without '@'. Required when mode is 'profile'."
    form: llm
  - name: subreddit
    type: string
    required: false
    label:
      en_US: "Subreddit"
      zh_Hans: "Subreddit"
    human_description:
      en_US: "Optional: limit a Reddit search to one subreddit (e.g. 'SaaS')."
      zh_Hans: "可选：将 Reddit 搜索限定在某个 subreddit（如 'SaaS'）。"
    llm_description: "Optional subreddit name without 'r/' to scope a Reddit search, e.g. 'startups'. Reddit only."
    form: llm
  - name: approval_threshold
    type: number
    required: false
    label:
      en_US: "Approval threshold (USD)"
      zh_Hans: "审批阈值（美元）"
      pt_BR: "Limite de aprovação (USD)"
      ja_JP: "承認しきい値（米ドル）"
    human_description:
      en_US: "Calls quoted at or above this amount require approved=true (default 0.30)."
      zh_Hans: "报价达到该金额的调用需要 approved=true（默认 0.30）。"
      pt_BR: "Chamadas cotadas neste valor ou acima exigem approved=true (padrão 0.30)."
      ja_JP: "見積もりがこの金額以上の呼び出しには approved=true が必要（デフォルト 0.30）。"
    llm_description: "Price gate in USD: every call is price-quoted upstream first (free), and quotes at or above this amount are refused until approved=true. Pass the user's configured threshold verbatim on every call; omit for the default (0.30)."
    form: llm
  - name: approved
    type: boolean
    required: false
    label:
      en_US: "Cost approved"
      zh_Hans: "已批准费用"
      pt_BR: "Custo aprovado"
      ja_JP: "費用承認済み"
    human_description:
      en_US: "Required for calls quoted at or above the approval threshold. Without it, the tool returns an approval request instead of running."
      zh_Hans: "报价达到审批阈值的调用必需。未设置时工具返回审批请求而不执行。"
      pt_BR: "Obrigatório para chamadas cotadas no limite de aprovação ou acima. Sem ele, a ferramenta retorna um pedido de aprovação em vez de executar."
      ja_JP: "見積もりが承認しきい値以上の呼び出しに必須。未設定の場合、ツールは実行せず承認リクエストを返します。"
    llm_description: "Cost-approval flag for calls quoted at or above the approval threshold. Set true ONLY after the user explicitly approved the cost (in conversation or via an approval form). Never set it on your own initiative."
    form: llm
extra:
  python:
    source: tools/social_listening.py
