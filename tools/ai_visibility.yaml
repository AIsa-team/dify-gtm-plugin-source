identity:
  name: "ai_visibility"
  author: "aisa-team"
  label:
    en_US: "AI Visibility"
    zh_Hans: "AI 可见度"
    pt_BR: "Visibilidade em IA"
    ja_JP: "AI可視性"
description:
  human:
    en_US: "See how AI answer engines (ChatGPT, Gemini, Perplexity, Google AI Mode) answer any prompt — GEO/AEO brand visibility tracking with Oxylabs via AIsa."
    zh_Hans: "查看 AI 答案引擎（ChatGPT、Gemini、Perplexity、Google AI Mode）如何回答任意问题——通过 AIsa 使用 Oxylabs 进行 GEO/AEO 品牌可见度追踪。"
    pt_BR: "Veja como os mecanismos de resposta de IA (ChatGPT, Gemini, Perplexity, Google AI Mode) respondem a qualquer prompt — rastreamento de visibilidade GEO/AEO com Oxylabs via AIsa."
    ja_JP: "AI回答エンジン（ChatGPT、Gemini、Perplexity、Google AIモード）が任意のプロンプトにどう答えるかを確認——AIsa経由のOxylabsによるGEO/AEOブランド可視性トラッキング。"
  llm: "Answer-engine visibility (GEO/AEO) tracking across six engines. Sends a prompt to a real AI answer engine and returns its live answer — use to check whether and how a brand, product, or competitor appears when users ask AI assistants questions like 'best CRM for startups'. Sources: chatgpt, gemini, perplexity, claude, google_ai_mode, google_search (classic SERP). Requires 'prompt'."
parameters:
  - name: prompt
    type: string
    required: true
    label:
      en_US: "Prompt"
      zh_Hans: "提问"
    human_description:
      en_US: "The question to ask the AI engine, as a real user would phrase it."
      zh_Hans: "向 AI 引擎提出的问题，按真实用户的措辞。"
    llm_description: "The question to ask the answer engine, phrased as a real user would, e.g. 'what is the best project management tool for remote teams?'."
    form: llm
  - name: source
    type: select
    required: false
    default: chatgpt
    options:
      - value: chatgpt
        label:
          en_US: "ChatGPT"
      - value: gemini
        label:
          en_US: "Gemini"
      - value: perplexity
        label:
          en_US: "Perplexity"
      - value: claude
        label:
          en_US: "Claude"
      - value: google_ai_mode
        label:
          en_US: "Google AI Mode"
      - value: google_search
        label:
          en_US: "Google Search (classic)"
    label:
      en_US: "Answer engine"
      zh_Hans: "答案引擎"
    human_description:
      en_US: "Which engine to query."
      zh_Hans: "要查询的引擎。"
    llm_description: "One of: chatgpt, gemini, perplexity, claude, google_ai_mode, google_search. Default chatgpt."
    form: llm
  - name: model
    type: string
    required: false
    label:
      en_US: "Model override"
      zh_Hans: "模型覆盖"
    human_description:
      en_US: "Optional exact model name for the LLM engines (e.g. sonar-pro, claude-sonnet-5). Leave empty for the flagship default."
      zh_Hans: "可选：LLM 引擎的精确模型名（如 sonar-pro、claude-sonnet-5）。留空使用旗舰默认。"
    llm_description: "Optional exact model name for chatgpt/gemini/perplexity/claude (must match the provider's catalog). Leave empty unless the user names a specific model."
    form: llm
  - name: geo_location
    type: string
    required: false
    label:
      en_US: "Geo location"
      zh_Hans: "地理位置"
    human_description:
      en_US: "Optional location context, e.g. 'United States'."
      zh_Hans: "可选的地理位置上下文，如 'United States'。"
    llm_description: "Optional geographic location for the query context, e.g. 'United States' or 'Germany'."
    form: llm
  - name: approval_threshold
    type: number
    required: false
    label:
      en_US: "Approval threshold (USD)"
      zh_Hans: "审批阈值（美元）"
      pt_BR: "Limite de aprovação (USD)"
      ja_JP: "承認しきい値（米ドル）"
    human_description:
      en_US: "Calls quoted at or above this amount require approved=true (default 0.30)."
      zh_Hans: "报价达到该金额的调用需要 approved=true（默认 0.30）。"
      pt_BR: "Chamadas cotadas neste valor ou acima exigem approved=true (padrão 0.30)."
      ja_JP: "見積もりがこの金額以上の呼び出しには approved=true が必要（デフォルト 0.30）。"
    llm_description: "Price gate in USD: every call is price-quoted upstream first (free), and quotes at or above this amount are refused until approved=true. Pass the user's configured threshold verbatim on every call; omit for the default (0.30)."
    form: llm
  - name: approved
    type: boolean
    required: false
    label:
      en_US: "Cost approved"
      zh_Hans: "已批准费用"
      pt_BR: "Custo aprovado"
      ja_JP: "費用承認済み"
    human_description:
      en_US: "Required for calls quoted at or above the approval threshold. Without it, the tool returns an approval request instead of running."
      zh_Hans: "报价达到审批阈值的调用必需。未设置时工具返回审批请求而不执行。"
      pt_BR: "Obrigatório para chamadas cotadas no limite de aprovação ou acima. Sem ele, a ferramenta retorna um pedido de aprovação em vez de executar."
      ja_JP: "見積もりが承認しきい値以上の呼び出しに必須。未設定の場合、ツールは実行せず承認リクエストを返します。"
    llm_description: "Cost-approval flag for calls quoted at or above the approval threshold. Set true ONLY after the user explicitly approved the cost (in conversation or via an approval form). Never set it on your own initiative."
    form: llm
extra:
  python:
    source: tools/ai_visibility.py
