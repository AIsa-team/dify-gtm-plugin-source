name: AIsa contract-drift audit

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline test suite
        run: python3 tests/test_offline.py
      - name: Live contract audit (read-only, no credit spent)
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
        run: python3 tests/contract_audit.py
